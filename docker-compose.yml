version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: smartblood_postgres
    restart: always
    environment:
      POSTGRES_USER: smartblood_user
      POSTGRES_PASSWORD: smartblood_password
      POSTGRES_DB: smartblood_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartblood_user -d smartblood_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartblood_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://smartblood_user:smartblood_password@database:5432/smartblood_db
      - SECRET_KEY=smartblood-production-secret-key-2026
      - USE_SYNTHETIC_ERAKTKOSH_DATA=True
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartblood_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
